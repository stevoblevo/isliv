<style>
html,body{margin:0;height:100%;background:#f4c9a8;overflow:hidden;overscroll-behavior:none}
body{min-height:100dvh;background:linear-gradient(180deg,#f8ddd1,#f4c9a8 52%,#e8b892);touch-action:none;user-select:none}
.plate{position:fixed;inset:0;display:grid;justify-items:end;align-items:start}
.plate img{width:100%;height:100%;max-width:100vw;max-height:100dvh;object-fit:contain;object-position:right top;pointer-events:none}
@media(min-width:900px){.plate img{width:auto;height:100%;max-width:min(56vw,720px);object-position:right center}}
</style>
</head>
<body>
<main class="plate" aria-label="is.liv colour test">
<img src="isliv-embed.jpg" width="720" height="900" alt="is.liv colour test — a softer brighter you" draggable="false" decoding="async" fetchpriority="high">
</main>
<script>
try{history.replaceState(null,"","#view=isliv")}catch(e){}
window.addEventListener("keydown",function(ev){if(ev.key==="Escape")ev.preventDefault()});
</script>
</body>
